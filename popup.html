<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>X Reply Bot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Login gate modal -->
  <div id="login-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-icon">◈</div>
      <h2>Not logged in to X</h2>
      <p>Sign in to X / Twitter to start generating replies.</p>
      <div class="modal-actions">
        <button id="btn-open-x-login">Open X</button>
        <button id="btn-check-again" class="secondary">Check Again</button>
      </div>
    </div>
  </div>

  <div id="app">

    <!-- ── Main screen ── -->
    <div id="main-screen">

      <header>
        <div class="header-left">
          <span class="logo">✦</span>
          <span class="title">Reply Bot</span>
        </div>
        <span id="login-dot" class="dot dot-gray" title="Checking login..."></span>
      </header>

      <div id="context-banner" class="banner hidden">
        <span class="banner-icon"></span>
        <span id="context-banner-text"></span>
      </div>

      <!-- Voice picker — prominent buttons above nav -->
      <section id="voice-section">
        <div class="section-label">Reply as</div>
        <div id="voice-buttons"><!-- rendered by JS --></div>
      </section>

      <!-- Nav -->
      <section id="nav-section">
        <button id="btn-open-x">Open X →</button>
        <button id="btn-go-list" class="secondary">My Lists</button>
      </section>

      <!-- Actions (on any x.com page) -->
      <section id="list-section" class="hidden">
        <div class="post-count-row">
          <label class="post-count-label">Posts to reply</label>
          <input id="post-count-input" type="number" min="1" max="500" value="10" />
        </div>
        <button id="btn-generate" class="full-width">Generate Replies</button>
        <div id="bulk-row" class="hidden">
          <button id="btn-draft-all" disabled class="secondary small">Draft All</button>
          <button id="btn-post-all"  disabled class="secondary small">Post All</button>
          <span id="draft-counter"></span>
        </div>
        <div id="clear-row" class="hidden">
          <button id="btn-clear-data" class="danger small">Clear Data</button>
          <span id="clear-msg" class="hidden success-msg">Cleared!</span>
        </div>
        <div id="progress-row" class="hidden">
          <span id="progress-text">Generating...</span>
          <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
        </div>
      </section>

      <!-- Reply cards — fills remaining height -->
      <div id="cards-section"></div>

      <!-- Settings — API key only -->
      <details id="settings-section">
        <summary>⚙ Settings</summary>
        <div id="settings-body">
          <div class="settings-row">
            <label class="settings-label">OpenAI API Key</label>
            <div class="settings-input-row">
              <input id="api-key-input" type="password" placeholder="sk-..." />
              <button id="btn-save-key" class="small">Save</button>
            </div>
            <span id="key-saved-msg" class="hidden success-msg">Saved!</span>
          </div>
          <div class="settings-row">
            <label class="settings-label">AI Model</label>
            <select id="model-select">
              <option value="gpt-5.4">gpt-5.4 (default)</option>
              <option value="gpt-4o">gpt-4o</option>
              <option value="gpt-4o-mini">gpt-4o-mini</option>
              <option value="gpt-4-turbo">gpt-4-turbo</option>
              <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
              <option value="custom">Custom…</option>
            </select>
            <input id="model-custom-input" type="text" placeholder="Enter model name" class="hidden" />
          </div>
          <div class="settings-row">
            <label class="settings-label">Open As</label>
            <div id="mode-buttons" class="mode-buttons"></div>
            <span id="mode-saved-msg" class="hidden success-msg">Saved — reopen the extension to apply</span>
          </div>
        </div>
      </details>

    </div>

    <!-- ── Custom voice screen ── -->
    <div id="custom-voice-screen" class="screen hidden">

      <div class="screen-header">
        <button id="btn-back" class="btn-back">← Back</button>
        <span class="screen-title">Custom Voice</span>
      </div>

      <div class="screen-body">
        <div class="form-group">
          <label class="form-label" for="custom-voice-name">Voice Name</label>
          <input id="custom-voice-name" type="text" placeholder="e.g. Elon Musk" />
        </div>
        <div class="form-group">
          <label class="form-label" for="custom-voice-prompt">Voice Prompt</label>
          <textarea id="custom-voice-prompt" rows="7"
            placeholder="You are replying to X/Twitter posts as [name]. Your tone is..."></textarea>
        </div>
        <button id="btn-save-voice" class="full-width">Save Voice</button>
        <span id="voice-saved-msg" class="hidden saved-confirm">Voice saved!</span>

        <div id="saved-voices-section" class="hidden">
          <div class="saved-voices-title">Saved Voices</div>
          <div id="saved-voices-list"></div>
        </div>
      </div>

    </div>

  </div>

  <script type="module" src="scripts/popup.js"></script>
</body>
</html>
